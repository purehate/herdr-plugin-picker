id = "purehate.herdr-ssh"
name = "SSH Picker"
version = "0.1.0"

# 0.9.0 is the only version this has been built and run against, and the field
# is pure gatekeeping — herdr refuses to link or install when the minimum is
# newer than the binary, so setting it low does not make an older herdr work,
# it just replaces a clear refusal with a confusing failure. The archaeology,
# for whoever considers lowering it:
#
#   0.7.4  session-modal popup panes, for `type = "popup"` keybindings AND
#          plugin panes, with cell or percentage sizing (#1125). This is the
#          feature the picker is built on.
#   0.8.0  relative plugin commands resolve from the plugin root (#1949).
#          Every command below is relative, so this one is load-bearing.
#   0.9.0  unix plugin panes keep PWD aligned with the requested working
#          directory (#2984, #3024).
#
# So the real floor is somewhere around 0.8.0, and dropping to it would be an
# untested compatibility claim. Lower it when someone has actually run the
# picker on that version, not before.
min_herdr_version = "0.9.0"
description = "Fuzzy-pick a host from ~/.ssh/config and SSH into a new pane, tab, or zoomed pane."
platforms = ["macos", "linux"]

[[build]]
command = ["go", "build", "-o", "bin/", "./cmd/herdr-ssh"]

[[actions]]
id = "open-picker"
title = "Open SSH Picker"
contexts = ["workspace", "pane"]
command = ["./bin/herdr-ssh", "plugin", "open-picker"]

# placement = "popup" is what makes the picker a floating box rather than a
# pane docked into the layout. It is deliberately declared here rather than
# left to a keybinding: a `type = "popup"` keybinding also floats, but it runs
# a bare command, so it needs an absolute path to this plugin's binary — a path
# that is only knowable on the machine that checked the repo out. Declaring the
# placement on the pane means anyone can install this and bind
# `purehate.herdr-ssh.open-picker` with no paths at all.
#
# `herdr plugin pane open --help` lists only overlay/split/tab/zoomed and omits
# popup. The help is a subset of what the parser accepts, not a superset: the
# API schema's PluginPanePlacement enum includes popup, and ray.plugin-manager
# ships exactly this shape in production.
#
# Cells rather than a percentage, for the same reason the README gives: the
# picker fills whatever it is handed, so a percentage of a large terminal is a
# wall instead of a dialog. 94 columns fits an alias plus user@hostname:port;
# 28 rows holds a dozen hosts and the preview.
[[panes]]
id = "picker"
title = "SSH Hosts"
placement = "popup"
width = 94
height = 28
command = ["./bin/herdr-ssh", "picker"]

[[panes]]
id = "session"
title = "ssh"
placement = "split"
command = ["./bin/herdr-ssh", "session"]
